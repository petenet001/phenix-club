name: phenix_client
description: "Application adhérent Phenix Club : abonnement, paiements, présences et pointage par QR code."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  get_it: ^9.3.0
  go_router: ^18.1.2
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Icône : tête du phénix sur fond noir (dart run flutter_launcher_icons)
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app-icon-foreground.png

# Écran de démarrage natif unique (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#000000"
  image: assets/splash/splash-logo.png
  android_12:
    color: "#000000"
    icon_background_color: "#000000"
    image: assets/splash/splash-android12.png
  fullscreen: false
